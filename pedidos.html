<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - EcoVida</title>
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="CSS/vistaadmin.css">
</head>

<body>

    <!-- ENCABEZADO -->

    <header>
        <h1>🌱 EcoVida</h1>
        <p>Pedidos registrados</p>
    </header>


    <!-- MENÚ -->

    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="carrito.html">🛒 Carrito</a>
        <a href="pedidos.html">📦 Pedidos</a>
        <a href="quiz.html">✨ Quiz</a>
        <!-- Componente de Cierre de Sesión Corporativo -->
        <button onclick="cerrarSesionCorporativa()" id="btn-logout-nav" style="
        background-color: #ef4444; 
        color: white; 
        border: none; 
        padding: 8px 16px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 600;
        font-family: sans-serif;
        transition: background 0.2s;
        display: none; /* Se oculta por defecto hasta que el JS verifique la sesión */
    " onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">
            🚪 Cerrar Sesión
        </button>
    </nav>


    <!-- PEDIDOS -->

    <section>
        <h2>📦 Pedidos registrados</h2>
        <div id="listaPedidos">
            <p>Cargando pedidos...</p>
        </div>

    </section>


    <!-- PIE DE PÁGINA -->

    <footer>
        <p>© 2026 EcoVida - Productos sostenibles</p>
    </footer>


    <!-- JAVASCRIPT -->

    <!-- 1. Primero cargamos de forma obligatoria el archivo de JavaScript externo -->
    <script src="JS/ecovida.js"></script>

    <!-- 2. Una vez cargado el script base, inicializamos el renderizado de forma segura -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            mostrarPedidos();
        });
    </script>
</body>

</html>
