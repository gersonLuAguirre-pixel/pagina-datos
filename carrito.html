<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito - EcoVida</title>

    <link rel="stylesheet" href="CSS/estilos.css">

</head>

<body>

    <header>
        <h1>🌱 EcoVida</h1>
        <p>Mi carrito</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="#">🛒 Carrito</a>
        <a href="pedidos.html">📦 Pedidos</a>
        <a href="quiz.html">✨ Quiz</a>
        <!-- Componente de Cierre de Sesión Corporativo -->
        <button onclick="cerrarSesionCorporativa()" id="btn-logout-nav" style="
        background-color: #ef4444; 
        color: white; 
        border: none; 
        padding: 8px 16px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 600;
        font-family: sans-serif;
        transition: background 0.2s;
        display: none; /* Se oculta por defecto hasta que el JS verifique la sesión */
    " onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">
            🚪 Cerrar Sesión
        </button>
    </nav>

    <main>

        <h2>🛒 Productos en mi carrito</h2>

        <div id="listaCarrito">
            <p>El carrito esta vacio.</p>
        </div>

        <h3>
            Total: S/ <span id="total">0.00</span>
        </h3>

        <button onclick="vaciarCarrito()">
            Vaciar carrito
        </button>

        <button onclick="guardarPedido()">
            Confirmar pedido 📦
        </button>

    </main>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <!-- JavaScript de EcoVida -->

    <script src="./JS/ecovida.js"></script>
    <script>
        mostrarCarrito();
    </script>

</body>

</html>
